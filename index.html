<!doctype html>
<html lang="en">

<title>Zero to Five — Baby &amp; Kids Clothing</title>
<meta name="description" content="Zero to Five — Baby & Kids Clothing. Contact us on WhatsApp or Instagram.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--black:#000;--blue:#5ec4f2;--pink:#f08cb4;--green:#62c962}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--black);color:#fff;font-family:Fredoka,ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
main{width:100%;max-width:420px;text-align:center}
.logo{display:block;width:200px;height:auto;max-width:60vw;margin:0 auto 16px}
h1{font-size:34px;font-weight:600}
h1 .t{color:var(--pink)}
.sub{margin-top:4px;color:var(--blue);font-size:18px;font-weight:500}
.bar{width:56px;height:4px;margin:20px auto 28px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--pink))}
a.btn{display:flex;align-items:center;width:100%;min-height:78px;padding:0 22px 0 18px;margin-bottom:16px;border-radius:999px;color:#fff;text-decoration:none;font-size:27px;font-weight:600;letter-spacing:.2px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.4);-webkit-tap-highlight-color:transparent;transition:transform .1s}
a.btn:active{transform:scale(.97)}
a.btn .ic{width:48px;height:48px;flex:none}
a.btn .lbl{flex:1;text-align:center}
a.btn .arr{width:22px;height:22px;flex:none;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wa{background:linear-gradient(180deg,#6fd36f,#58bd58)}
.wa .ic{fill:#fff}
.ig{background:linear-gradient(180deg,#f59bbf,#ec80ab)}
.contact{margin-top:6px;color:#9aa0ac;font-size:15px;font-weight:500;line-height:1.6}
</style>
</head>
